// ==========================================
// Smart Parking Gate - Simulation Toolbox
// ==========================================

// --- 1. SYSTEM INITIALIZATION ---
FUNC void Init_Ports(void) {
    PORTD = 0x00;
    PORTE = 0x00;
    printf("--> Ports D and E initialized to 0 (Unpressed).\n");
}
DEFINE BUTTON "0. INIT SYSTEM", "Init_Ports()"

// --- 2. DRIVER PANEL (Port E) ---
DEFINE BUTTON "Drv OPEN (Press)",    "PORTE |= 0x01"
DEFINE BUTTON "Drv OPEN (Release)",  "PORTE &= ~0x01"

DEFINE BUTTON "Drv CLOSE (Press)",   "PORTE |= 0x02"
DEFINE BUTTON "Drv CLOSE (Release)", "PORTE &= ~0x02"

// --- 3. SECURITY PANEL (Port E) ---
DEFINE BUTTON "Sec OPEN (Press)",    "PORTE |= 0x04"
DEFINE BUTTON "Sec OPEN (Release)",  "PORTE &= ~0x04"

DEFINE BUTTON "Sec CLOSE (Press)",   "PORTE |= 0x08"
DEFINE BUTTON "Sec CLOSE (Release)", "PORTE &= ~0x08"

// --- 4. LIMIT SWITCHES (Port D) ---
DEFINE BUTTON "Limit OPEN (Hit)",    "PORTD |= 0x01"
DEFINE BUTTON "Limit OPEN (Clear)",  "PORTD &= ~0x01"

DEFINE BUTTON "Limit CLOSED (Hit)",  "PORTD |= 0x02"
DEFINE BUTTON "Limit CLOSED (Clear)","PORTD &= ~0x02"

// --- 5. OBSTACLE SENSOR (Port D) ---
// *FIXED*: Uses 'signal' instead of 'FUNC' so twatch() works legally.
signal void Tap_Obstacle(void) {
    PORTD |= 0x04;    
    twatch(1600000);  
    PORTD &= ~0x04;   
}

DEFINE BUTTON "Obstacle (Hold)",     "PORTD |= 0x04"
DEFINE BUTTON "Obstacle (Release)",  "PORTD &= ~0x04"